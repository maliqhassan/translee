apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.transeemlkit'
version = '0.1.0'

android {
  namespace 'expo.modules.transeemlkit'
  compileSdk rootProject.ext.compileSdkVersion

  defaultConfig {
    // ML Kit translate requires API 21+; Expo SDK 57 targets well above this.
    minSdk rootProject.ext.minSdkVersion
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib:${kotlinVersion}"

  // On-device translation. Downloads its own models through Play services, so
  // nothing is bundled into the APK and no credential is required.
  implementation 'com.google.mlkit:translate:17.0.3'
}
