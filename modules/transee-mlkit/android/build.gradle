plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

// `expo-module-gradle-plugin` supplies compileSdk, minSdk, the Kotlin and Java
// toolchains and the expo-modules-core dependency, exactly as it does for every
// module shipped in the SDK. Setting those by hand is how a module drifts out
// of step with the app it is built into.
//
// The coordinates below are not optional decoration: the plugin registers a
// Maven publication for every module and fails configuration with
// "'android.defaultConfig.versionName' is not defined" without them. Every
// module in the SDK declares the same four values for the same reason.
group = 'com.transee'
version = '0.1.0'

android {
  namespace 'expo.modules.transeemlkit'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // On-device translation. Models are downloaded through Play services at
  // runtime, so nothing is bundled into the APK and no credential is needed.
  implementation 'com.google.mlkit:translate:17.0.3'
}
